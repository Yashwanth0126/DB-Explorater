services:
  - type: web
    name: credential-rotation-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: Credential Rotation System
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: credential-rotation-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: 60
      - key: ENCRYPTION_KEY
        sync: false   # set manually in Render dashboard - see DEPLOY.md
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false   # set manually in Render dashboard
      - key: ADMIN_EMAIL
        sync: false
      - key: SCHEDULER_INTERVAL_MINUTES
        value: 60
      - key: NOTIFICATIONS_ENABLED
        value: "false"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        value: "true"

databases:
  - name: credential-rotation-db
    plan: free
    databaseName: credential_rotation
    user: credential_rotation_user
